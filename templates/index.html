<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог растений</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9f5ec;
            color: #2f4f2f;
        }
        h1 {
            font-weight: 700;
            color: #2a5d34;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-control {
            border: 2px solid #66bb6a;
            transition: border-color 0.3s ease;
        }
        .form-control:focus {
            border-color: #388e3c;
            box-shadow: none;
        }
        .btn-success {
            background-color: #4caf50;
            border-color: #4caf50;
            font-weight: 600;
        }
        .btn-success:hover {
            background-color: #388e3c;
            border-color: #2e7d32;
        }
        .list-group-item {
            border: none;
            border-bottom: 1px solid #a5d6a7;
            background-color: transparent;
            padding: 0.75rem 1rem;
            transition: background-color 0.2s ease;
        }
        .list-group-item a {
            color: #2e7d32;
            font-weight: 500;
            text-decoration: none;
        }
        .list-group-item:hover {
            background-color: #c8e6c9;
        }
    </style>
</head>
<body class="container py-4">
    <h1>Каталог растений</h1>
    <form class="mb-4 d-flex justify-content-center" method="get" action="/">
        <input class="form-control me-2" style="max-width: 400px;" type="text" name="q" placeholder="Поиск растения..." value="{{ query }}">
        <button class="btn btn-success" type="submit">Поиск</button>
    </form>
    <ul class="list-group">
    {% for plant in plants %}
        <li class="list-group-item">
            <a href="{{ url_for('plant_card', plant_name=plant['Plant_Name']) }}">{{ plant['Plant_Name'] }}</a>
        </li>
    {% endfor %}
    </ul>
</body>
</html>
