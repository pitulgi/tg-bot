<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ plant['Plant_Name'] }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9f5ec;
            color: #2f4f2f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
            background: #f7fcf8;
        }
        .card-title {
            font-weight: 700;
            color: #2e7d32;
            text-align: center;
        }
        .list-group-item {
            border: none;
            border-bottom: 1px solid #a5d6a7;
            background-color: transparent;
            padding: 0.6rem 1rem;
            font-size: 1rem;
        }
        .list-group-item:last-child {
            border-bottom: none;
        }
        .fw-bold {
            color: #4caf50;
        }
        a.btn-primary {
            background-color: #4caf50;
            border-color: #4caf50;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        a.btn-primary:hover {
            background-color: #388e3c;
            border-color: #2e7d32;
            text-decoration: none;
        }
        img {
            border-radius: 0.5rem;
            max-height: 250px;
            object-fit: cover;
            display: block;
            margin: 0 auto 1.25rem;
            box-shadow: 0 2px 6px rgba(46, 125, 50, 0.25);
        }
    </style>
</head>
<body>
    <div class="container py-5 d-flex justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title mb-4">{{ plant['Plant_Name'] }}</h2>
                    {% if plant['Photo'] %}
                        <img src="{{ url_for('static', filename='images/' ~ plant['Photo']) }}" alt="{{ plant['Plant_Name'] }}">
                    {% endif %}
                    <ul class="list-group list-group-flush mb-4">
                        {% for key, ru_name in field_labels.items() %}
                            {% if key in plant %}
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <span class="fw-bold">{{ ru_name }}:</span>
                                    <span>{{ plant[key] }}</span>
                                </li>
                            {% endif %}
                        {% endfor %}
                    </ul>
                    <a href="{{ url_for('index') }}" class="btn btn-primary w-100">← Назад к каталогу</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
